<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>xatu — intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700&display=swap" />
<!--
  xatu — a 30-second intro, rendered rather than recorded.

  The whole film is a pure function of time: render(t) draws frame t, and
  buildSong() schedules every note on the same clock. promo/render.mjs steps
  t through 900 frames, renders the soundtrack offline, and hands both to
  ffmpeg, so every hit lands on its frame and the file is identical every run.

  Open this page directly to preview: click to play with sound, R restarts,
  ?t=12.5 freezes one frame.

  120 BPM — one beat is 0.5s, one bar is 2s. Times below are film time;
  the cold open sits half a second in front of them.
     cold   a half-second flash-forward of the finished tree, torn away
     0–4    team preview: twelve sprites slam in on eighth notes
     4–8    "what do they lead?" — a slot machine over their six, tightening
     8      the drop: three branches fire out of your lead
     8–17   the tree grows; the camera flies through it
    17–21   one path lights up — the turn you already planned for
    21–22   the screen opens onto paper
    22–30   xatu
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden; font-family: Geist, system-ui, sans-serif; }
  canvas { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: #6b6660;
          font-size: 12px; letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
  body.playing #hint, body.render #hint { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<div id="hint">click to play with sound · R to restart</div>
<script>
"use strict";
const W = 1080, H = 1080, DUR = 30;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const params = new URLSearchParams(location.search);
if (params.has("render")) document.body.classList.add("render");

/* ------------------------------------------------------------ utilities */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inCubic: u => u * u * u,
  inOutCubic: u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  outExpo: u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u)),
  outBack: u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
// Seeded, so every frame and every noise buffer is identical on every run.
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let x = s;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/* -------------------------------------------------------------- palette */
const C = {
  night: "#0c0b0a", paper: "#fafaf8", ink: "#1c1917", stone: "#78716c",
  light: "#f5f5f4", amber: "#f59e0b", red: "#e5484d",
};
// The app's own type colours (app/demo/type-colors.ts).
const TYPE = {
  Normal: "#A8A77A", Electric: "#F7D02C", Fighting: "#C22E28", Flying: "#A98FF3",
  Psychic: "#F95587", Fairy: "#D685AD", Dragon: "#6F35FC", Fire: "#EE8130",
};

/* -------------------------------------------------------------- sprites */
// Hotlinked from Showdown, exactly as the app does it.
const SPRITES = ["golisopod", "basculegion", "pelipper", "archaludon", "sneasler", "salamence",
                 "arcanine-hisui", "indeedee-f", "talonflame", "kommoo", "gardevoir-mega"];
// Showdown sends no CORS headers, so a canvas that draws its sprites cannot
// be exported. promo/render.mjs serves this page and proxies the sprites from
// the same origin (cached, never committed); opened as a file, the page
// hotlinks them directly, which is fine for previewing.
const SERVED = location.protocol.startsWith("http");
const IMG = {};
const spritesReady = Promise.all(SPRITES.map(n => new Promise(res => {
  const im = new Image();
  im.onload = im.onerror = () => res();
  im.src = SERVED ? `sprites/${n}.png` : `https://play.pokemonshowdown.com/sprites/gen5/${n}.png`;
  IMG[n] = im;
})));

function sprite(name, x, y, size, alpha = 1) {
  const im = IMG[name];
  if (!im || !im.naturalWidth || alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, x - size / 2, y - size / 2, size, size);
  ctx.restore();
}

/* ------------------------------------------------------------ the cast */
const THEM = ["golisopod", "basculegion", "pelipper", "archaludon", "sneasler", "salamence"];
const YOU = ["arcanine-hisui", "indeedee-f", "talonflame", "kommoo", "gardevoir-mega", "sneasler"];
const SLAM_THEM = i => i * 0.25;          // eighth notes, 0 → 1.25
const SLAM_YOU = i => 1.75 + i * 0.25;    // 1.75 → 3.0
const YOUR_LEADS = [1, 4];                // Indeedee-F, Gardevoir-Mega
const LOCK = [2, 0];                      // they lead Pelipper + Golisopod
const LOCK_T = 7.2;
const ROW_X = i => 540 + (i - 2.5) * 150;

// The slot machine: which pair of theirs is lit, tightening toward the lock.
const SLOT = (() => {
  const pairs = [[0, 1], [2, 3], [4, 5], [1, 3], [0, 4], [2, 5], [3, 4], [1, 5], [0, 3], [2, 4], [1, 2], [3, 5], [0, 5]];
  const out = [];
  let t = 4.0, gap = 0.36, k = 0;
  while (t < LOCK_T - 0.04) { out.push({ t, pair: pairs[k % pairs.length] }); t += gap; gap = Math.max(0.07, gap * 0.84); k++; }
  out.push({ t: LOCK_T, pair: LOCK });
  return out;
})();
const slotAt = t => { let cur = null; for (const s of SLOT) if (s.t <= t) cur = s; return cur; };

/* ------------------------------------------------------------- the tree */
const NODES = {
  R:  { x: 0,   y: 0,    kind: "root", sprites: ["indeedee-f", "gardevoir-mega"] },
  A:  { x: 430, y: -290, kind: "pair", sprites: ["pelipper", "golisopod"] },
  B:  { x: 430, y: 0,    kind: "pair", sprites: ["archaludon", "basculegion"] },
  Cc: { x: 430, y: 290,  kind: "pair", sprites: ["salamence", "sneasler"] },
  A1: { x: 860, y: -425, kind: "leaf" },
  A2: { x: 860, y: -255, kind: "leaf", comesIn: "archaludon" },
  B1: { x: 860, y: -85,  kind: "leaf" },
  B2: { x: 860, y: 85,   kind: "leaf" },
  C1: { x: 860, y: 255,  kind: "leaf" },
  C2: { x: 860, y: 425,  kind: "leaf" },
};
// Main line in light, alternates in dashed amber — the board's own grammar.
const EDGES = [
  { from: "R",  to: "A",  t0: 8.0,    dur: 1.2, main: true, chip: { text: "Thunderbolt", type: "Electric", target: "pelipper" } },
  { from: "R",  to: "B",  t0: 8.125,  dur: 1.2, chip: { text: "Hyper Voice", type: "Fairy" } },
  { from: "R",  to: "Cc", t0: 8.25,   dur: 1.2, chip: { text: "Expanding Force", type: "Psychic" } },
  { from: "A",  to: "A1", t0: 10.5,   dur: 1.0, main: true, chip: { text: "Follow Me", type: "Normal" } },
  { from: "A",  to: "A2", t0: 10.625, dur: 1.0, chip: { text: "Thunderbolt", type: "Electric", target: "archaludon" } },
  { from: "B",  to: "B1", t0: 10.75,  dur: 1.0, main: true, chip: { text: "Protect", type: "Normal" } },
  { from: "B",  to: "B2", t0: 10.875, dur: 1.0, chip: { text: "Expanding Force", type: "Psychic" } },
  { from: "Cc", to: "C1", t0: 11.0,   dur: 1.0, main: true, chip: { text: "Hyper Voice", type: "Fairy" } },
  { from: "Cc", to: "C2", t0: 11.125, dur: 1.0, chip: { text: "Follow Me", type: "Normal" } },
];
const ARRIVE = {};
for (const e of EDGES) ARRIVE[e.to] = e.t0 + e.dur;
// The line that actually happens: they switch Pelipper for Archaludon.
const PATH = new Set(["R>A", "A>A2"]);
const onPath = e => PATH.has(`${e.from}>${e.to}`);
const PULSE = [{ e: "R>A", a: 17.45, b: 18.0 }, { e: "A>A2", a: 18.0, b: 18.5 }];

const outX = n => n.x + (n.kind === "leaf" ? 16 : 98);
const inX = n => n.x - (n.kind === "leaf" ? 16 : 98);
function bez(e, u) {
  const a = NODES[e.from], b = NODES[e.to];
  const x0 = outX(a), y0 = a.y, x3 = inX(b), y3 = b.y, mx = (x0 + x3) / 2;
  const v = 1 - u;
  return [
    v * v * v * x0 + 3 * v * v * u * mx + 3 * v * u * u * mx + u * u * u * x3,
    v * v * v * y0 + 3 * v * v * u * y0 + 3 * v * u * u * y3 + u * u * u * y3,
  ];
}

/* --------------------------------------------------------------- camera */
const CAM = [
  { t: 8.0,  x: 0,   y: 0,    z: 1.75 },
  { t: 9.3,  x: 220, y: 0,    z: 1.2 },
  { t: 10.6, x: 430, y: 0,    z: 1.0 },
  { t: 12.6, x: 560, y: 0,    z: 0.88 },
  { t: 16.5, x: 430, y: 0,    z: 0.82 },
  { t: 20.9, x: 540, y: -110, z: 0.98 },
];
let camOverride = null;   // the cold open frames the whole tree its own way
function cam(t) {
  if (camOverride) return camOverride;
  let k = CAM[0];
  if (t >= CAM[CAM.length - 1].t) k = CAM[CAM.length - 1];
  else if (t > CAM[0].t) for (let i = 0; i < CAM.length - 1; i++) {
    const a = CAM[i], b = CAM[i + 1];
    if (t >= a.t && t <= b.t) { const u = E.inOutCubic(seg(t, a.t, b.t)); k = { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u) }; break; }
  }
  const d = seg(t, 8.3, 9.6);   // drift eases in, so the hand-off at 8.0 is exact
  return { x: k.x + Math.sin(t * 0.5) * 7 * d, y: k.y + Math.cos(t * 0.37) * 6 * d, z: k.z };
}
const toScreen = (wx, wy, c) => [W / 2 + (wx - c.x) * c.z, H / 2 + (wy - c.y) * c.z];

/* ------------------------------------------------------------- drawing */
function kinetic(str, x, y, t, o) {
  const { size = 72, weight = 800, family = "Bricolage Grotesque", color = "#fff", align = "left",
          tIn, tOut = null, stagger = 0.022, glow = 0 } = o;
  if (t < tIn) return;
  if (tOut !== null && t > tOut + 0.4 + str.length * stagger * 0.6) return;
  ctx.save();
  ctx.font = `${weight} ${size}px "${family}"`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const chars = [...str];
  const adv = chars.map(ch => ctx.measureText(ch).width - size * 0.012);
  const total = adv.reduce((a, b) => a + b, 0);
  let cx = align === "center" ? x - total / 2 : x;
  chars.forEach((ch, i) => {
    const p = seg(t, tIn + i * stagger, tIn + i * stagger + 0.6);
    const ein = E.outExpo(p);
    let alpha = clamp(p * 2.2), dy = (1 - ein) * size * 0.62, rot = (1 - ein) * 0.18;
    const sc = 0.82 + 0.18 * ein;
    if (tOut !== null) {
      const q = seg(t, tOut + i * stagger * 0.6, tOut + i * stagger * 0.6 + 0.32);
      const eo = E.inCubic(q);
      alpha *= 1 - eo; dy -= eo * size * 0.55; rot -= eo * 0.12;
    }
    if (alpha > 0.002) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx + adv[i] / 2, y + dy);
      ctx.rotate(rot);
      ctx.scale(sc, sc);
      if (glow) { ctx.shadowColor = "rgba(255,255,255,.35)"; ctx.shadowBlur = glow; }
      ctx.fillStyle = color;
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }
    cx += adv[i];
  });
  ctx.restore();
}

function chip(c, x, y, alpha, scale) {
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.font = '700 24px "Geist"';
  const tw = ctx.measureText(c.text).width;
  const w = tw + 30 + (c.target ? 70 : 0), h = 44;
  ctx.shadowColor = TYPE[c.type];
  ctx.shadowBlur = 22;
  ctx.fillStyle = TYPE[c.type];
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 22); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = c.type === "Electric" ? C.ink : "#fff";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(c.text, -w / 2 + 15, 1);
  if (c.target) {
    ctx.globalAlpha *= 0.8;
    ctx.fillText("→", -w / 2 + 15 + tw + 8, 1);
    ctx.globalAlpha /= 0.8;
    sprite(c.target, -w / 2 + 15 + tw + 52, -2, 46);
  }
  ctx.restore();
}

function glowStroke(color, width, blur, alpha = 1) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha *= 0.55 * alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.strokeStyle = color;
  ctx.lineWidth = width * 2.4;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
  ctx.restore();
}

function burst(x, y, t, t0, seed, { n = 14, speed = 260, life = 0.6, color = "#fff", size = 4 } = {}) {
  const age = t - t0;
  if (age < 0 || age > life) return;
  const r = rng(seed);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2, sp = speed * (0.4 + r() * 0.8), s = size * (0.5 + r());
    const k = E.outCubic(age / life);
    ctx.globalAlpha = (1 - age / life) * 0.9;
    ctx.beginPath();
    ctx.arc(x + Math.cos(ang) * sp * k * life, y + Math.sin(ang) * sp * k * life, s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function ring(x, y, t, t0, { r0 = 20, r1 = 150, life = 0.65, color = "#fff", width = 4 } = {}) {
  const age = t - t0;
  if (age < 0 || age > life) return;
  const u = E.outCubic(age / life);
  ctx.save();
  ctx.globalAlpha = (1 - age / life) * 0.85;
  ctx.strokeStyle = color;
  ctx.lineWidth = width * (1 - u * 0.6);
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, u), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

const DUST = (() => { const r = rng(7); return Array.from({ length: 80 }, () => ({ x: r() * W, y: r() * H, v: 6 + r() * 16, s: 0.6 + r() * 1.8, a: 0.05 + r() * 0.16, p: r() * 6.28 })); })();
function dust(t, c) {
  ctx.save();
  ctx.fillStyle = "#fff";
  for (const d of DUST) {
    const px = ((d.x - (c ? c.x * 0.12 : 0) + t * d.v * 0.4) % W + W) % W;
    const py = ((d.y - (c ? c.y * 0.12 : 0) - t * d.v) % H + H) % H;
    ctx.globalAlpha = d.a * (0.6 + 0.4 * Math.sin(t * 1.3 + d.p));
    ctx.beginPath(); ctx.arc(px, py, d.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, W * 0.28, W / 2, H / 2, W * 0.78);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.62)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ----------------------------------------------- 0–8s: team preview */
function shakeAt(t) {
  let x = 0, y = 0;
  const hit = (t0, amp, len) => {
    const a = t - t0;
    if (a >= 0 && a < len) { const k = amp * (1 - a / len); x += Math.sin(a * 140 + t0 * 9) * k; y += Math.cos(a * 113 + t0 * 7) * k; }
  };
  for (let i = 0; i < 6; i++) { hit(SLAM_THEM(i), 7, 0.2); hit(SLAM_YOU(i), 7, 0.2); }
  hit(LOCK_T, 14, 0.35);
  hit(8.0, 16, 0.4);
  return [x, y];
}

function halo(x, y, r, rgb, a) {
  if (a <= 0.002) return;
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function scenePreview(t) {
  const [sx, sy] = shakeAt(t);
  ctx.save();
  ctx.translate(sx, sy);

  const fadeAll = 1 - seg(t, 7.3, 7.65);

  // the team-preview clock, draining into the lock
  const left = 1 - seg(t, 0, LOCK_T);
  ctx.save();
  ctx.globalAlpha = fadeAll;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(140, 470); ctx.lineTo(940, 470);
  ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 4; ctx.stroke();
  if (left > 0) { ctx.beginPath(); ctx.moveTo(140, 470); ctx.lineTo(140 + 800 * left, 470); glowStroke(C.amber, 4, 18); }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.5 * fadeAll * seg(t, 0, 0.4);
  ctx.fillStyle = "#fff"; ctx.font = '600 17px "Geist"'; ctx.textAlign = "center";
  ctx.letterSpacing = "6px";
  ctx.fillText("THEM", 540, 205);
  ctx.fillText("YOU", 540, 895);
  ctx.restore();

  const cur = t >= 4.0 ? slotAt(t) : null;
  const locked = t >= LOCK_T;
  const cp = E.inOutCubic(seg(t, 7.35, 8.0));
  const c8 = cam(8.0);

  THEM.forEach((n, i) => {
    const ts = SLAM_THEM(i);
    if (t < ts) return;
    const p = seg(t, ts, ts + 0.34);
    let x = ROW_X(i), y = 300, size = 118 * lerp(1.9, 1, E.outBack(p));
    let a = seg(t, ts, ts + 0.05);
    const lit = !!cur && cur.pair.includes(i);
    if (cur) { a *= lit ? 1 : 0.28; if (lit) size *= 1.1; }
    if (locked && LOCK.includes(i)) {
      // the pair they lead flies off toward the node that will hold it
      const k = LOCK.indexOf(i);
      const [nx, ny] = toScreen(NODES.A.x + (k === 0 ? -42 : 42), NODES.A.y, c8);
      x = lerp(x, nx, cp); y = lerp(y, ny, cp); size = lerp(size, 84 * c8.z, cp);
    } else if (t > 7.3) {
      a *= 1 - seg(t, 7.3, 7.62);
      size *= 1 - 0.35 * seg(t, 7.3, 7.62);
    }
    if (lit) halo(x, y, size * 0.78, "245,158,11", (locked ? 0.55 : 0.38) * a);
    sprite(n, x, y, size, a);
    burst(ROW_X(i), 300, t, ts, 100 + i);
  });
  if (locked) LOCK.forEach(i => ring(ROW_X(i), 300, t, LOCK_T, { r0: 50, r1: 140, color: C.amber, width: 5, life: 0.32 }));

  YOU.forEach((n, i) => {
    const ts = SLAM_YOU(i);
    if (t < ts) return;
    const p = seg(t, ts, ts + 0.34);
    let x = ROW_X(i), y = 780, size = 118 * lerp(1.9, 1, E.outBack(p));
    let a = seg(t, ts, ts + 0.05);
    const lead = YOUR_LEADS.includes(i);
    const pick = seg(t, 5.0, 5.4);
    if (!lead) a *= 1 - 0.7 * pick;
    if (lead) {
      const k = YOUR_LEADS.indexOf(i);
      const [nx, ny] = toScreen(k === 0 ? -42 : 42, 0, c8);
      x = lerp(x, nx, cp); y = lerp(y, ny, cp); size = lerp(size, 84 * c8.z, cp);
      halo(x, y, size * 0.72, "255,255,255", 0.22 * pick);
    } else if (t > 7.3) {
      a *= 1 - seg(t, 7.3, 7.62);
    }
    sprite(n, x, y, size, a);
    burst(ROW_X(i), 780, t, ts, 200 + i);
  });

  ctx.restore();

  kinetic("team preview.", 540, 600, t, { size: 74, align: "center", tIn: -0.35, tOut: 3.5, glow: 18 });
  kinetic("what do they lead?", 540, 600, t, { size: 76, align: "center", tIn: 3.8, tOut: 7.05, glow: 18 });
}

/* ------------------------------------------------- 8–21s: the tree */
function sceneTree(t) {
  const c = cam(t);
  const [sx, sy] = shakeAt(t);
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.scale(c.z, c.z);
  ctx.translate(-c.x, -c.y);

  // a world-space dot grid, so the camera's motion reads
  {
    const x0 = c.x - W / 2 / c.z - 90, x1 = c.x + W / 2 / c.z + 90;
    const y0 = c.y - H / 2 / c.z - 90, y1 = c.y + H / 2 / c.z + 90;
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 0.07 * seg(t, 8.0, 8.6);
    for (let gx = Math.floor(x0 / 90) * 90; gx < x1; gx += 90)
      for (let gy = Math.floor(y0 / 90) * 90; gy < y1; gy += 90) {
        ctx.beginPath(); ctx.arc(gx, gy, 1.7 / c.z, 0, Math.PI * 2); ctx.fill();
      }
    ctx.restore();
  }

  const dim = seg(t, 17.2, 17.9);
  const flash = seg(t, 20.5, 20.75) * (1 - seg(t, 20.75, 21.0));

  for (const e of EDGES) {
    const p = E.outCubic(seg(t, e.t0, e.t0 + e.dur));
    if (p <= 0) continue;
    const key = `${e.from}>${e.to}`;
    const path = onPath(e);
    const pulsed = PULSE.find(q => q.e === key);
    const lit = pulsed ? seg(t, pulsed.a, pulsed.b) : 0;
    const alpha = Math.min(1, (path ? 1 : 1 - 0.74 * dim) + flash);
    const color = e.main ? C.light : C.amber;
    ctx.save();
    ctx.lineCap = "round";
    if (!e.main) { ctx.setLineDash([16, 13]); ctx.lineDashOffset = -t * 46; }
    ctx.beginPath();
    const N = 56, upto = Math.max(2, Math.ceil(N * p));
    for (let k = 0; k <= upto; k++) { const [x, y] = bez(e, Math.min(p, k / N)); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    glowStroke(color, path ? lerp(5, 8, lit) : 5, path ? lerp(20, 42, lit) : 20, alpha);
    ctx.restore();

    // the growth head
    if (p < 1) {
      const [hx, hy] = bez(e, p);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 34);
      g.addColorStop(0, "rgba(255,255,255,0.95)");
      g.addColorStop(0.3, e.main ? "rgba(255,255,255,0.4)" : "rgba(245,158,11,0.5)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 34, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // sparks shed behind it
    {
      const r = rng(900 + EDGES.indexOf(e));
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = e.main ? "#fff" : C.amber;
      for (let k = 0; k < 34; k++) {
        const u = k / 34, born = e.t0 + u * e.dur * 0.75, age = t - born, life = 0.9;
        const jx = (r() - 0.5) * 14, jy = (r() - 0.5) * 14, vx = (r() - 0.5) * 60, vy = -20 - r() * 50, s = 1.2 + r() * 2.4;
        if (age < 0 || age > life) continue;
        const [bx, by] = bez(e, u);
        ctx.globalAlpha = (1 - age / life) * 0.8 * alpha;
        ctx.beginPath(); ctx.arc(bx + jx + vx * age, by + jy + vy * age, s, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // the move rides the head, then settles beside its line
    const ca = seg(t, e.t0 + e.dur * 0.1, e.t0 + e.dur * 0.1 + 0.18);
    if (ca > 0) {
      const settle = E.outCubic(seg(t, e.t0 + e.dur, e.t0 + e.dur + 0.4));
      const [hx, hy] = bez(e, Math.max(p, 0.08));
      const [mx, my] = bez(e, 0.56);
      chip(e.chip, lerp(hx, mx, settle), lerp(hy, my, settle) - 36,
           ca * (path ? 1 : 1 - 0.7 * dim), lerp(0.92, 1, settle) * (1 + 0.06 * lit));
    }
  }

  // light running along the line that happens
  for (const q of PULSE) {
    if (t < q.a || t > q.b + 0.05) continue;
    const e = EDGES.find(x => `${x.from}>${x.to}` === q.e);
    const [px, py] = bez(e, E.inOutCubic(seg(t, q.a, q.b)));
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(px, py, 0, px, py, 60);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.25, "rgba(255,214,140,0.7)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 60, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  for (const [id, n] of Object.entries(NODES)) {
    const at = id === "R" ? 8.0 : ARRIVE[id];
    if (t < at) continue;
    const pp = seg(t, at, at + 0.45);
    const s = id === "R" ? 1 : E.outBack(pp);
    const onP = id === "R" || id === "A" || id === "A2";
    const a = Math.min(1, (onP ? 1 : 1 - 0.74 * dim) + flash);
    if (n.kind === "leaf") {
      const hot = id === "A2";
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(n.x, n.y); ctx.scale(s, s);
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.strokeStyle = hot ? C.amber : "rgba(255,255,255,.85)"; ctx.lineWidth = 4;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 18; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.restore();
      if (n.comesIn) sprite(n.comesIn, n.x + 66, n.y - 2, 92 * s, a);
      ring(n.x, n.y, t, at, { r0: 12, r1: 90, color: hot ? C.amber : "#fff", width: 3 });
      burst(n.x, n.y, t, at, 500 + id.charCodeAt(1), { n: 10, speed: 200, life: 0.5, color: hot ? C.amber : "#fff", size: 3 });
    } else {
      const cardA = id === "R" ? seg(t, 8.0, 8.35) : clamp(pp * 3);
      ctx.save();
      ctx.globalAlpha = a * cardA;
      ctx.translate(n.x, n.y); ctx.scale(s, s);
      ctx.beginPath(); ctx.roundRect(-98, -54, 196, 108, 22);
      ctx.fillStyle = "rgba(255,255,255,0.055)"; ctx.fill();
      ctx.strokeStyle = id === "R" ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.16)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(n.x, n.y); ctx.scale(s, s);
      sprite(n.sprites[0], -42, 0, 84);
      sprite(n.sprites[1], 42, 0, 84);
      ctx.restore();
      if (id !== "R") {
        ring(n.x, n.y, t, at, { r0: 40, r1: 190, color: "#fff", width: 4 });
        burst(n.x, n.y, t, at, 400 + id.charCodeAt(0) * 3 + id.length, { n: 16, speed: 300, life: 0.6, size: 4 });
      }
    }
    if (id === "A") ring(n.x, n.y, t, 18.0, { r0: 30, r1: 220, color: C.amber, width: 6, life: 0.8 });
    if (id === "A2") ring(n.x, n.y, t, 18.5, { r0: 30, r1: 160, color: C.amber, width: 6, life: 0.8 });
  }

  ctx.restore();
  dust(t, c);

  kinetic("plan the branch,", 70, 150, t, { size: 78, tIn: 9.55, tOut: 15.75, glow: 22 });
  kinetic("not the paragraph.", 70, 1002, t, { size: 78, tIn: 12.45, tOut: 15.85, glow: 22 });
  kinetic("you've already seen this turn.", 70, 150, t, { size: 60, tIn: 17.45, tOut: 20.4, glow: 22 });

  if (flash > 0) { ctx.save(); ctx.globalAlpha = flash * 0.18; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

/* --------------------------------------------------- 21–30s: paper */
const URL_TEXT = "xatu-six.vercel.app";
const URL_T0 = 24.6, URL_STEP = 1.2 / URL_TEXT.length;

function sceneEnd(t) {
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);

  // the tree, small, as the mark: your lead, a main line, an alternate
  const ox = 330, oy = 300;
  const gm = E.outCubic(seg(t, 22.3, 23.0)), ga = E.outCubic(seg(t, 22.5, 23.2));
  const leadsIn = E.outBack(seg(t, 22.1, 22.55));
  const edge = (y1, p, color, dashed) => {
    if (p <= 0) return;
    ctx.save();
    ctx.lineCap = "round";
    if (dashed) { ctx.setLineDash([14, 12]); ctx.lineDashOffset = -t * 30; }
    ctx.beginPath();
    for (let k = 0; k <= 40; k++) {
      const u = Math.min(p, k / 40), x0 = ox + 88, x3 = ox + 380, mx = (x0 + x3) / 2, v = 1 - u;
      const x = v * v * v * x0 + 3 * v * v * u * mx + 3 * v * u * u * mx + u * u * u * x3;
      const y = v * v * v * oy + 3 * v * v * u * oy + 3 * v * u * u * y1 + u * u * u * y1;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.stroke();
    ctx.restore();
    if (p >= 1) { ctx.beginPath(); ctx.arc(ox + 392, y1, 11, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
  };
  edge(oy - 62, gm, C.stone, false);
  edge(oy + 62, ga, C.amber, true);
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(leadsIn, leadsIn);
  sprite("indeedee-f", -34, 0, 76, seg(t, 22.1, 22.25));
  sprite("gardevoir-mega", 34, 0, 76, seg(t, 22.1, 22.25));
  ctx.restore();
  // a heartbeat on the bar lines, so the end card never freezes
  for (const b of [24, 26, 28]) ring(ox, oy, t, b, { r0: 50, r1: 120, color: C.amber, width: 3, life: 0.9 });

  // the wordmark drops in on sixteenths
  ctx.save();
  ctx.font = '800 236px "Bricolage Grotesque"';
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  const letters = ["x", "a", "t", "u"];
  const adv = letters.map(l => ctx.measureText(l).width - 6);
  let lx = 540 - adv.reduce((a, b) => a + b, 0) / 2;
  letters.forEach((l, i) => {
    const t0 = 22.0 + i * 0.125, p = seg(t, t0, t0 + 0.62), a = seg(t, t0, t0 + 0.12);
    if (a > 0) {
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(lx + adv[i] / 2, 650 + (E.outBack(p) - 1) * 110);
      ctx.rotate((1 - E.outCubic(p)) * -0.3);
      ctx.fillStyle = C.ink;
      ctx.fillText(l, 0, 0);
      ctx.restore();
    }
    lx += adv[i];
  });
  ctx.restore();

  kinetic("See turn one coming.", 540, 745, t, { size: 44, weight: 500, family: "Geist", color: C.stone, align: "center", tIn: 23.55, stagger: 0.018 });

  // the link types itself, one keystroke per tick in the soundtrack
  if (t >= URL_T0) {
    ctx.save();
    ctx.font = '600 36px "Geist"';
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    const full = ctx.measureText(URL_TEXT).width;
    const n = Math.min(URL_TEXT.length, Math.floor((t - URL_T0) / URL_STEP) + 1);
    const shown = URL_TEXT.slice(0, n);
    const x0 = 540 - full / 2;
    ctx.fillStyle = C.red;
    ctx.fillText(shown, x0, 850);
    const w = ctx.measureText(shown).width;
    if (n < URL_TEXT.length || Math.floor(t * 2.4) % 2 === 0) ctx.fillRect(x0 + w + 4, 822, 3, 36);
    const ul = E.outCubic(seg(t, 25.9, 26.5));
    if (ul > 0) ctx.fillRect(x0, 864, full * ul, 3);
    ctx.restore();
  }
}

/* ---------------------------------------------------------- the frame */
// The film opens on a half-second flash-forward: the finished tree, lit, with
// its last line on screen — then it glitches out to black and the film
// starts. A bird that sees the future gets to see it first. It also makes
// frame 0, which X uses as the preview, the strongest frame in the video.
const OPEN = 0.5;
const ghost = document.createElement("canvas");
ghost.width = W; ghost.height = H;
let ghostReady = false;

function render(t) {
  if (t >= OPEN) { renderMain(t - OPEN); return; }
  if (!ghostReady) {
    camOverride = { x: 430, y: -30, z: 0.86 };
    renderMain(19.35);
    camOverride = null;
    ghost.getContext("2d").drawImage(cv, 0, 0);
    ghostReady = true;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const push = 1 + 0.045 * E.outCubic(seg(t, 0, OPEN));
  const tear = seg(t, 0.26, 0.42);
  const gone = seg(t, 0.38, 0.47);
  ctx.save();
  ctx.globalAlpha = 1 - gone;
  ctx.translate(W / 2, H / 2); ctx.scale(push, push); ctx.translate(-W / 2, -H / 2);
  if (tear <= 0) ctx.drawImage(ghost, 0, 0);
  else {
    // tear it into horizontal slices that slide apart
    const r = rng(1000 + Math.floor(t * 60));
    for (let y = 0; y < H; ) {
      const h = 10 + Math.floor(r() * 70);
      const dx = (r() - 0.5) * 260 * tear * tear;
      ctx.drawImage(ghost, 0, y, W, h, dx, y, W, h);
      if (r() < 0.25 * tear) {
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35 * tear;
        ctx.drawImage(ghost, 0, y, W, h, dx + 14, y, W, h);
        ctx.restore();
      }
      y += h;
    }
  }
  ctx.restore();
}

function renderMain(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = C.night;
  ctx.fillRect(0, 0, W, H);

  if (t < 21.95) {
    if (t < 8.0) { scenePreview(t); dust(t, null); }
    else sceneTree(t);
    vignette();
  }

  // the screen opens onto paper from the leaf that happened
  if (t >= 21.0) {
    const [cx, cy] = toScreen(NODES.A2.x, NODES.A2.y, cam(21.0));
    const r = E.inCubic(seg(t, 21.0, 21.95)) * 1750;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(0.1, r), 0, Math.PI * 2); ctx.clip();
    sceneEnd(t);
    ctx.restore();
    if (t < 21.95) {
      ctx.save();
      ctx.strokeStyle = C.amber; ctx.lineWidth = 10 * (1 - seg(t, 21.0, 21.95));
      ctx.shadowColor = C.amber; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(0.1, r), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ======================================================= the soundtrack
   Original and synthesized, scheduled on the same clock as render(t). */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noiseBuf(ac, secs, seed) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * secs), ac.sampleRate);
  const d = b.getChannelData(0), r = rng(seed);
  for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
  return b;
}
function impulse(ac, secs, decay) {
  const len = Math.floor(ac.sampleRate * secs);
  const b = ac.createBuffer(2, len, ac.sampleRate), r = rng(31);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return b;
}

function buildSong(ac, out, T0real) {
  const T0 = T0real + OPEN;
  const at = s => T0 + s;
  const master = ac.createGain();
  master.gain.setValueAtTime(0.85, T0real);
  master.gain.setValueAtTime(0.85, at(26.9));
  master.gain.linearRampToValueAtTime(0.0001, at(DUR - OPEN));
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4;
  comp.attack.value = 0.004; comp.release.value = 0.18;
  // a dB of headroom after the compressor: X re-encodes, and peaks near 0dBFS
  // come back clipped
  const trim = ac.createGain(); trim.gain.value = 0.84;
  master.connect(comp); comp.connect(trim); trim.connect(out);

  const rev = ac.createConvolver(); rev.buffer = impulse(ac, 2.6, 2.6);
  const revOut = ac.createGain(); revOut.gain.value = 0.32;
  rev.connect(revOut); revOut.connect(master);
  const delay = ac.createDelay(1.0); delay.delayTime.value = 0.375;
  const fb = ac.createGain(); fb.gain.value = 0.34;
  const dlp = ac.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 2600;
  delay.connect(dlp); dlp.connect(fb); fb.connect(delay);
  const delayOut = ac.createGain(); delayOut.gain.value = 0.5;
  dlp.connect(delayOut); delayOut.connect(master);

  const NB = noiseBuf(ac, 2, 99);
  const env = (g, t, a, peak, d) => {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  };
  const noise = (t, len, filt, f, q, vel, decay, sends = {}) => {
    const s = ac.createBufferSource(); s.buffer = NB;
    const bq = ac.createBiquadFilter(); bq.type = filt; bq.frequency.value = f; bq.Q.value = q;
    const g = ac.createGain();
    env(g, t, 0.002, vel, decay);
    s.connect(bq); bq.connect(g); g.connect(master);
    if (sends.rev) { const r = ac.createGain(); r.gain.value = sends.rev; g.connect(r); r.connect(rev); }
    s.start(t, (t * 7.3) % 1.5); s.stop(t + len);
  };

  const kick = (s, vel = 1) => {
    const t = at(s);
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
    const g = ac.createGain(); env(g, t, 0.003, vel, 0.42);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.5);
    noise(t, 0.03, "highpass", 2500, 0.7, 0.12 * vel, 0.012);
  };
  const hat = (s, vel = 0.1, open = false) => noise(at(s), open ? 0.3 : 0.06, "highpass", 7600, 0.8, vel, open ? 0.2 : 0.035);
  const clap = s => { for (const o of [0, 0.011, 0.023]) noise(at(s + o), 0.25, "bandpass", 1500, 0.9, 0.38, 0.14, { rev: 0.45 }); };
  const snr = (s, vel) => noise(at(s), 0.15, "bandpass", 1900, 1.1, vel, 0.07, { rev: 0.2 });
  const tick = (s, vel) => {
    const t = at(s);
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = 1900;
    const g = ac.createGain(); env(g, t, 0.001, vel, 0.035);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.06);
  };
  const pluck = (s, m, vel = 0.25, { dec = 0.42, toRev = 0.35, toDelay = 0.3, bright = 3200 } = {}) => {
    const t = at(s);
    const g = ac.createGain(); env(g, t, 0.004, vel, dec);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 2;
    lp.frequency.setValueAtTime(bright, t); lp.frequency.exponentialRampToValueAtTime(600, t + dec);
    for (const [type, det] of [["triangle", 0], ["square", 7]]) {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = mtof(m); o.detune.value = det;
      const og = ac.createGain(); og.gain.value = type === "square" ? 0.28 : 1;
      o.connect(og); og.connect(lp); o.start(t); o.stop(t + dec + 0.1);
    }
    lp.connect(g); g.connect(master);
    if (toRev) { const r = ac.createGain(); r.gain.value = toRev; g.connect(r); r.connect(rev); }
    if (toDelay) { const d = ac.createGain(); d.gain.value = toDelay; g.connect(d); d.connect(delay); }
  };
  const bass = (s, m, len, vel = 0.42) => {
    const t = at(s);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.01);
    g.gain.setValueAtTime(vel, t + len * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 5;
    lp.frequency.setValueAtTime(950, t); lp.frequency.exponentialRampToValueAtTime(260, t + len);
    const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m);
    const sub = ac.createOscillator(); sub.type = "sine"; sub.frequency.value = mtof(m - 12);
    const sg = ac.createGain(); sg.gain.value = 0.7;
    o.connect(lp); sub.connect(sg); sg.connect(g); lp.connect(g); g.connect(master);
    o.start(t); sub.start(t); o.stop(t + len + 0.05); sub.stop(t + len + 0.05);
  };
  const pad = (s, notes, len, vel = 0.06, cutoff = 1300) => {
    const t = at(s);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + 0.35);
    g.gain.setValueAtTime(vel, t + len - 0.25); g.gain.linearRampToValueAtTime(0.0001, t + len + 0.5);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cutoff; lp.Q.value = 0.8;
    for (const m of notes) for (const det of [-9, 9]) {
      const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + len + 0.6);
    }
    lp.connect(g); g.connect(master);
    const r = ac.createGain(); r.gain.value = 0.6; g.connect(r); r.connect(rev);
  };
  const riser = (s0, s1, vel = 0.2) => {
    const t0 = at(s0), t1 = at(s1);
    const src = ac.createBufferSource(); src.buffer = NB; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 2.4;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(7000, t1);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vel, t1 - 0.02); g.gain.setValueAtTime(0.0001, t1);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t1 + 0.01);
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(180, t0); o.frequency.exponentialRampToValueAtTime(1400, t1);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(vel * 0.25, t1 - 0.02); og.gain.setValueAtTime(0.0001, t1);
    o.connect(og); og.connect(master); o.start(t0); o.stop(t1 + 0.01);
  };
  const boom = (s, vel = 0.9) => {
    const t = at(s);
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.4);
    const g = ac.createGain(); env(g, t, 0.005, vel, 1.6);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.8);
    noise(t, 0.9, "lowpass", 1400, 0.7, 0.35, 0.6, { rev: 0.6 });
  };

  // the glimpse: a bright swell that tears into a stutter, then silence
  {
    const t0 = T0real;
    for (const m of [76, 81, 88]) {
      const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = mtof(m);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.24);
      g.gain.setValueAtTime(0.0001, t0 + 0.42);
      o.connect(g); g.connect(master);
      const r = ac.createGain(); r.gain.value = 0.7; g.connect(r); r.connect(rev);
      o.start(t0); o.stop(t0 + 0.44);
    }
    for (const d of [0.27, 0.31, 0.345, 0.375, 0.4]) noise(t0 + d, 0.03, "bandpass", 3000, 1.5, 0.22, 0.02);
  }

  // A minor: Am F C G
  const CH = { Am: [57, 60, 64], F: [53, 57, 60], C: [60, 64, 67], G: [55, 59, 62] };
  const ROOT = { Am: 45, F: 41, C: 48, G: 43 };

  // 0–4: the twelve slams play a pentatonic line over a ticking clock
  const lineThem = [69, 72, 74, 76, 79, 81], lineYou = [64, 67, 69, 72, 74, 76];
  for (let i = 0; i < 6; i++) {
    kick(SLAM_THEM(i), 0.5); pluck(SLAM_THEM(i), lineThem[i], 0.2, { dec: 0.3 });
    kick(SLAM_YOU(i), 0.55); pluck(SLAM_YOU(i), lineYou[i], 0.2, { dec: 0.3 });
  }
  pad(0, [45, 52, 57, 60], 4, 0.05, 700);
  for (let s = 0; s < 7.5; s += 0.5) tick(s, lerp(0.05, 0.16, s / 7.5));

  // 4–8: the slot machine; a snare roll and a riser into a breath of silence
  pad(4, CH.F.map(m => m - 12), 2, 0.05, 900);
  pad(6, CH.G.map(m => m - 12), 2, 0.06, 1100);
  for (let s = 4; s < 7.875; s += 0.125) hat(s, lerp(0.025, 0.11, (s - 4) / 3.875));
  for (const sl of SLOT) if (sl.t < LOCK_T) tick(sl.t, 0.07);
  for (let s = 6; s < 7; s += 0.25) snr(s, 0.14);
  for (let s = 7; s < 7.5; s += 0.125) snr(s, 0.24);
  for (let s = 7.5; s < 7.875; s += 0.0625) snr(s, 0.34);
  riser(4.0, 7.875, 0.17);
  pad(LOCK_T, [69, 72, 76], 0.25, 0.08, 3000);
  pluck(LOCK_T, 81, 0.3);

  // 8–20: the drop
  boom(8.0, 1);
  ["Am", "F", "C", "G", "Am", "F"].forEach((ch, bar) => {
    const s0 = 8 + bar * 2;
    pad(s0, CH[ch], 2, 0.045, 1600);
    const tones = [...CH[ch].map(m => m + 12), CH[ch][0] + 24];
    for (let k = 0; k < 16; k++) {
      const s = s0 + k * 0.125;
      if (k % 2 === 0) bass(s, ROOT[ch] + (k % 8 === 6 ? 12 : 0), 0.2);
      pluck(s, tones[[0, 1, 2, 3, 2, 1, 2, 0][k % 8]], 0.065, { dec: 0.16, toRev: 0.15, toDelay: 0.35, bright: 2600 });
      hat(s, k % 2 ? 0.05 : 0.07);
    }
  });
  for (let s = 8; s < 20; s += 0.5) kick(s, 1);
  for (let s = 8.5; s < 20; s += 1) clap(s);
  for (let s = 8.25; s < 20; s += 0.5) hat(s, 0.09, true);

  // the tree answers: each node rings out as a note when it lands
  ["A", "B", "Cc"].forEach((id, i) => pluck(ARRIVE[id], [76, 79, 81][i], 0.22));
  ["A1", "A2", "B1", "B2", "C1", "C2"].forEach((id, i) => pluck(ARRIVE[id], [69, 72, 74, 76, 79, 81][i], 0.16));
  // the path lights: a rising swell
  pad(17.45, [76, 81, 84], 1.6, 0.05, 4200);
  pluck(18.0, 84, 0.24); pluck(18.5, 88, 0.26);

  // 20–22: the floor drops out, a second riser, silence, then paper
  pad(20, CH.G, 2, 0.06, 1800);
  riser(20.0, 21.875, 0.2);
  for (let s = 21; s < 21.5; s += 0.125) snr(s, 0.2);
  for (let s = 21.5; s < 21.875; s += 0.0625) snr(s, 0.3);

  // 22–30: the wordmark
  boom(22.0, 0.8);
  kick(22.0, 1.1);
  pad(22, [48, 55, 60, 64, 67], 2, 0.065, 2400);
  [72, 76, 79, 84].forEach((m, i) => pluck(22.0 + i * 0.125, m, 0.22));
  pad(24, [43, 55, 59, 62], 2, 0.055, 2000);
  pad(26, [45, 57, 60, 64], 2, 0.055, 1800);
  pad(28, [41, 53, 57, 60], 2, 0.05, 1500);
  const outro = { 23: "C", 24: "G", 25: "G", 26: "Am", 27: "Am", 28: "F", 29: "F" };
  for (let s = 23; s < 30; s += 0.25) {
    const ch = outro[Math.floor(s)] || "C";
    pluck(s, CH[ch][Math.round(s * 4) % 3] + 12, 0.05, { dec: 0.3, toRev: 0.4, toDelay: 0.45 });
  }
  for (let k = 0; k < URL_TEXT.length; k++) tick(URL_T0 + k * URL_STEP, 0.05);
  for (const b of [24, 26, 28]) kick(b, 0.32);
}

/* -------------------------------------------------- render & preview */
function encodeWav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  const dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  str(0, "RIFF"); dv.setUint32(4, 36 + len * ch * 2, true); str(8, "WAVE"); str(12, "fmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true);
  dv.setUint16(34, 16, true); str(36, "data"); dv.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) {
    const v = Math.max(-1, Math.min(1, data[c][i]));
    dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2;
  }
  const bytes = new Uint8Array(dv.buffer);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

window.seek = t => render(t);
window.frame = (q = 0.95) => cv.toDataURL("image/jpeg", q).slice("data:image/jpeg;base64,".length);
window.renderWav = async () => {
  const sr = 48000;
  const off = new OfflineAudioContext(2, sr * DUR, sr);
  buildSong(off, off.destination, 0);
  return encodeWav(await off.startRendering());
};

(async () => {
  await spritesReady;
  await Promise.all([
    document.fonts.load('800 80px "Bricolage Grotesque"'),
    document.fonts.load('700 24px "Geist"'),
    document.fonts.load('600 36px "Geist"'),
    document.fonts.load('500 44px "Geist"'),
  ]);
  await document.fonts.ready;
  window.ready = true;

  if (params.has("render")) return;
  if (params.has("t")) { render(parseFloat(params.get("t"))); return; }
  render(0);

  let ac = null, T0 = 0, raf = 0;
  const loop = () => {
    const t = ac.currentTime - T0;
    render(Math.min(DUR, Math.max(0, t)));
    if (t < DUR) raf = requestAnimationFrame(loop);
    else document.body.classList.remove("playing");
  };
  const play = async () => {
    cancelAnimationFrame(raf);
    if (ac) await ac.close();
    ac = new AudioContext();
    T0 = ac.currentTime + 0.15;
    buildSong(ac, ac.destination, T0);
    document.body.classList.add("playing");
    loop();
  };
  addEventListener("click", play);
  addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") play(); });
})();
</script>
